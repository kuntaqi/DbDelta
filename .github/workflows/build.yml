name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/DbDelta.Web/package-lock.json

      # tsc -b runs first, so this is also the TypeScript check.
      - name: Build the SPA
        working-directory: src/DbDelta.Web
        run: |
          npm ci
          npm run build

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Linux has no LocalDB, so the integration tests skip there by design.
      - name: Test
        if: runner.os != 'Windows'
        run: dotnet test --configuration Release --no-build

      - name: Start LocalDB
        if: runner.os == 'Windows'
        run: SqlLocalDB start MSSQLLocalDB

      # A green run with skips proves nothing about the SQL Server provider, so on Windows a skip fails the job.
      - name: Test, including LocalDB integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = dotnet test --configuration Release --no-build 2>&1 | Tee-Object -Variable log
          $log | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $skipped = $log | Select-String -Pattern 'Skipped:\s+([1-9]\d*)'
          if ($skipped) { Write-Error "Tests were skipped; LocalDB integration did not run fully."; exit 1 }
